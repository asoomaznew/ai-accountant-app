<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <!-- Border outline -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#glow-grad)" stroke-width="8" opacity="0.4" />
  
  <!-- Accountant Symbol (Calculator / Dollar / Graph) -->
  <g transform="translate(106, 106)" filter="url(#glow)">
    <!-- Main calculator grid / sheet -->
    <rect x="20" y="20" width="260" height="260" rx="24" fill="none" stroke="url(#glow-grad)" stroke-width="16" />
    <!-- Sheet header bar -->
    <line x1="20" y1="80" x2="280" y2="80" stroke="url(#glow-grad)" stroke-width="16" />
    
    <!-- Table columns/lines -->
    <line x1="100" y1="80" x2="100" y2="280" stroke="url(#glow-grad)" stroke-width="12" opacity="0.7" />
    <line x1="190" y1="80" x2="190" y2="280" stroke="url(#glow-grad)" stroke-width="12" opacity="0.7" />
    
    <!-- Dollar sign or checkmark inside -->
    <circle cx="210" cy="180" r="40" fill="#0ea5e9" opacity="0.2" />
    
    <!-- AI nodes or sparkles -->
    <path d="M 230,40 L 240,60 L 260,70 L 240,80 L 230,100 L 220,80 L 200,70 L 220,60 Z" fill="#38bdf8" />
    <path d="M 60,200 L 65,210 L 75,215 L 65,220 L 60,230 L 55,220 L 45,215 L 55,210 Z" fill="#38bdf8" opacity="0.8" />
  </g>
</svg>
