# Render.com deployment config for the AI Accountant backend (FastAPI).
# Connect this repo in the Render dashboard → "Blueprint" and Render builds
# the web service below automatically.
#
# NOTE: The frontend is deployed separately on Vercel (see vercel.json).
# CORS now auto-allows any *.vercel.app origin (see backend/main.py regex),
# so you do NOT need to set CORS_ORIGINS manually — but you still can to
# pin a specific domain. PYTHON_VERSION is pinned to 3.11 for numpy compat.

services:
  - type: web
    name: ai-accountant-backend
    runtime: python
    plan: free
    region: oregon            # pick the region closest to you
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        sync: false           # Render injects this automatically
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        sync: false           # set in dashboard to your Vercel URL
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DISABLE_AUTH
        value: "true"         # single-user personal deployment: skip Google token check
      - key: ENVIRONMENT
        value: "production"
